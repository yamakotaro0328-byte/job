name: build

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Build and test
        run: mvn -B package
      - uses: actions/upload-artifact@v4
        with:
          name: ecojobs
          path: target/ecojobs-*.jar
          if-no-files-found: error
