# GUI icon per job (any item Material name). Unlisted jobs use the built-in icon.
# (日本語) GUIで使う職業アイコン(アイテム名)。未記載の職業は標準アイコン。
job-icons: {}

# Display names for each job id, shown in /jobs list, /jobs stats, /jobs top, and the GUI menu.
# Each name is prefixed with a & color code so job icons/text stand out in the GUI and chat
# instead of showing as plain white - see Messages#jobName and its callers.
job-names:
  en:
    # Colors are assigned by theme family, not per-job at random - 20 jobs can't each get a
    # unique legacy color (only 15 are legible against the GUI's dark tooltip background; &0
    # black is unreadable there), so where two jobs share a color it's a deliberate pairing
    # within the same family: hunter/slayer (kill-based combat), builder/beekeeper (warm
    # earth tones), woodcutter/crafter (wood), farmer/merchant (growth and value are both
    # "green" in Minecraft's own visual language), fisherman/explorer (outdoor/adventure).
    miner: "&7Miner&r"
    digger: "&8Digger&r"
    woodcutter: "&2Woodcutter&r"
    farmer: "&aFarmer&r"
    builder: "&6Builder&r"
    fisherman: "&bFisherman&r"
    treasurehunter: "&eTreasure Hunter&r"
    hunter: "&4Hunter&r"
    archer: "&3Archer&r"
    slayer: "&4Slayer&r"
    warrior: "&9Warrior&r"
    breeder: "&dBreeder&r"
    tamer: "&1Tamer&r"
    shearer: "&fShearer&r"
    beekeeper: "&6Beekeeper&r"
    enchanter: "&5Enchanter&r"
    smelter: "&cSmelter&r"
    crafter: "&2Crafter&r"
    merchant: "&aMerchant&r"
    explorer: "&bExplorer&r"
