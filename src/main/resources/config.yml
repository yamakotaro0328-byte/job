# EcoJobs configuration
# Language for messages below: "en" or "ja".
# (日本語) 以下のメッセージの言語。"en" または "ja"。
language: ja

# How many jobs a single player can be in at the same time.
# (日本語) 1人のプレイヤーが同時に加入できるジョブ数。
max-concurrent-jobs: 3

# Where job progress is saved. "yaml" (default) needs no setup. "mysql" shares progress across
# multiple servers pointed at the same database - fill in storage.mysql below.
# (日本語) ジョブの進行状況の保存先。"yaml"(デフォルト)は設定不要。"mysql"にすると、
# 同じデータベースを指す複数サーバー間で進行状況を共有できる(下のstorage.mysqlを設定)。
storage:
  type: yaml
  mysql:
    host: localhost
    port: 3306
    database: ecojobs
    username: root
    password: ""
    table-prefix: "ecojobs_"

leveling:
  # xp required to go from level N to N+1 = base-xp-to-level * N ^ growth-exponent
  # (日本語) レベルNからN+1に必要な経験値 = base-xp-to-level * N ^ growth-exponent
  #
  # At the defaults below, reaching max-level (100) takes ~74,250 total xp. The previous defaults
  # (50 / 1.35) needed ~1.04 million - effectively unreachable (roughly 300k blocks for a 0.2xp
  # digger action), which meant nobody ever saw the level milestones, prestige, or the job-perks
  # system (see jobs.<job>.perks below) that unlock deep into a job's levels.
  # (日本語) 上のデフォルト値では、最大レベル(100)到達に必要な経験値は合計約74,250。旧デフォルト
  # (50 / 1.35) では約104万必要で、事実上到達不可能だった(0.2xpの穴掘り行動なら約30万ブロック)。
  # その結果、レベルマイルストーンもプレステージも、深いレベルで解放される職業パーク
  # (下のjobs.<job>.perksを参照)も誰の目にも触れないままだった。
  base-xp-to-level: 15
  growth-exponent: 1.0
  # Money earned per action is multiplied by (1 + level * pay-bonus-per-level), so a level 40
  # miner earns 20% more per action than a level 0 miner at the default 0.005 (0.5%/level).
  # (日本語) 1回の行動で得るお金は (1 + レベル * pay-bonus-per-level) 倍される。デフォルトの
  # 0.005 (レベルごとに0.5%) だとレベル40で+20%になる。
  pay-bonus-per-level: 0.005
  max-level: 100
  # Once a job hits max-level, /jobs prestige <job> resets it to level 1 (and 0 xp) in exchange
  # for one permanent stack of this bonus, which stacks additively with pay-bonus-per-level - so
  # at the defaults, a prestige-3 level-40 miner earns (1 + 40*0.005 + 3*0.02) = +26% per action.
  # (日本語) ジョブが最大レベルに達すると、/jobs prestige <ジョブ名> でレベル1(経験値0)に
  # 戻す代わりに、この永続ボーナスが1つ蓄積される(pay-bonus-per-levelと加算される)。
  prestige-bonus-per-prestige: 0.02
  # Every job pays a one-time bonus (broadcast server-wide) whenever it reaches one of these
  # levels. Re-triggers on each future prestige cycle's relevel, since prestige exists to be
  # replayed. Set milestone-bonus-money to 0 to keep the fanfare without the payout.
  # (日本語) どのジョブも、これらのレベルに到達するたびに一度きりのボーナス(サーバー全体に
  # 告知)がもらえる。プレステージ後に同じレベルを再び通過した際も再発生する(プレステージは
  # 繰り返し遊ぶための仕組みのため)。演出だけ残して支払いを止めたい場合はmilestone-bonus-moneyを
  # 0にする。
  milestone-levels: [10, 25, 50, 75, 100]
  milestone-bonus-money: 100

# The "explorer" job doesn't have a block/entity/item action list like the others below - it
# pays out every time a player reaches a new farthest distance (in blocks, ignoring height) from
# their world's spawn point.
# (日本語) 「探検家」ジョブだけは下のjobsのactionsを使わず、ワールドスポーンから
# (高さを無視した)最も遠い距離を更新するたびに支払われる。
explorer:
  distance-per-milestone: 250
  money-per-milestone: 100
  xp-per-milestone: 60
  # See "jobs.<job>.perks" below for the full format - explorer's perks live here since it has no
  # "actions" table of its own.
  perks:
    - { level: 25, type: potion, value: 1, effect: SPEED }
    - { level: 75, type: pay-bonus, value: 10 }

# Auto-smelt perk (see jobs.miner.perks) result map: ore block -> smelted item. Only consulted for
# players who've unlocked an auto-smelt perk; everyone else keeps dropping the raw block as usual.
# (日本語) 自動精錬パーク(jobs.miner.perksを参照)の対応表: 鉱石ブロック -> 精錬後のアイテム。
# このパークを解放したプレイヤーにのみ適用され、それ以外は通常どおり未精錬でドロップする。
auto-smelt-map:
  IRON_ORE: IRON_INGOT
  DEEPSLATE_IRON_ORE: IRON_INGOT
  GOLD_ORE: GOLD_INGOT
  DEEPSLATE_GOLD_ORE: GOLD_INGOT
  NETHER_GOLD_ORE: GOLD_INGOT
  COPPER_ORE: COPPER_INGOT
  DEEPSLATE_COPPER_ORE: COPPER_INGOT
  ANCIENT_DEBRIS: NETHERITE_SCRAP

# 無限稼ぎ対策。
# - player-kill-cooldown-minutes: 同じ相手を倒して戦士の報酬が再び出るまでの分数。2人組で
#   延々と殺し合うだけで稼げてしまうのを防ぐ。0にすると制限なし。
# (日本語) なお、探検家のテレポート/エリトラ移動、建築士の「置いて壊す」繰り返し、弓術師の
# 動物撃ちは、いずれもコード側で対策済み(設定不要)。
anti-farm:
  player-kill-cooldown-minutes: 30
  # Pay multiplier (money and xp) for mobs by how they spawned - stops AFK mob farms from
  # printing money. Reasons are CreatureSpawnEvent.SpawnReason names; unlisted reasons pay 1.0,
  # 0 pays nothing. (日本語) 湧き方ごとの報酬倍率(お金・経験値)。放置トラップ対策。
  # 未記載の湧き方は1.0、0で報酬なし。
  spawn-reason-multipliers:
    SPAWNER: 0.25
    TRIAL_SPAWNER: 0.5
    SPAWNER_EGG: 0.0
    SLIME_SPLIT: 0.25
    BUILD_IRONGOLEM: 0.0
    BUILD_SNOWMAN: 0.0
    BUILD_WITHER: 1.0
  # Max money one player can earn from job actions per clock hour (0 = unlimited). Job xp is
  # never capped; daily-quest bonuses bypass it. ecojobs.bypass.hourlycap skips it.
  # (日本語) 1時間あたりに行動報酬で稼げるお金の上限(0で無制限)。経験値は制限されず、
  # デイリークエストの報酬も対象外。ecojobs.bypass.hourlycap 権限で無視できる。
  max-money-per-hour: 0

# Daily quests: each player gets per-day tasks drawn from the jobs they've joined, e.g. "Miner:
# break Iron ore x40". Completing one pays (normal pay for that work) x reward-multiplier on top of
# the normal pay, plus job xp. Stored in quests.yml. /jobs quests shows them.
# (日本語) デイリークエスト: 加入中のジョブから毎日お題が出る(例: 採掘工: 鉄鉱石を壊す x40)。
# 達成すると、その作業の通常報酬 × reward-multiplier がボーナスとして追加で入る(経験値も)。
# quests.yml に保存。/jobs quests で確認。
quests:
  enabled: true
  per-day: 3
  # Target amount ~= target-value / (money per action), +-25% and clamped to min/max-amount.
  # (日本語) 目標数 ≒ target-value ÷ 1回の報酬額 (±25%、min/max-amountの範囲に収める)。
  target-value: 400
  min-amount: 5
  max-amount: 128
  reward-multiplier: 2.0
  all-complete-bonus-money: 500
  reset-timezone: Asia/Tokyo
  excluded-actions: [kill-player, catch-emf-fish]

# Boss bar showing the job's xp progress whenever job xp is earned.
# (日本語) ジョブ経験値を得たときに進行度をボスバーで表示する。
bossbar:
  enabled: true
  hide-after-seconds: 4
  # PINK, BLUE, RED, GREEN, YELLOW, PURPLE, WHITE
  color: GREEN

# Console commands run on level-up / prestige. Placeholders: {player} {uuid} {job} {level} {prestige}
# (日本語) レベルアップ・プレステージ時にコンソールから実行するコマンド。
reward-commands:
  every-level: []
  # Any job reaching the given level. (日本語) どのジョブでも指定レベル到達時。
  levels:
    50: []
    100: []
  # Only a specific job reaching the given level. (日本語) 特定ジョブの指定レベル到達時。
  jobs:
    miner:
      100: []
  prestige: []

# Every other job: a map of action-type -> (material/entity name, or "default") -> {money, xp}.
# Material/entity names are the same names used in Java's Material/EntityType enums (as shown in
# the Bukkit/Paper API docs), case-insensitive. Add or remove entries freely; anything not listed
# for a job (and with no "default" entry) simply doesn't pay out for that job.
# (日本語) 他のジョブはすべて action-type -> (素材名/エンティティ名、または"default") ->
# {money, xp} の対応表になっている。名前はJavaのMaterial/EntityType列挙型と同じ表記
# (大文字小文字は区別しない)。自由に追加・削除でき、載っていない("default"も無い)ものは
# そのジョブでは何ももらえないだけ。
#
# Any job can also have a "perks:" list - level-gated bonuses beyond money/xp, shown in the GUI's
# per-job detail screen (shift-right-click a job). Each entry is {level, type, value, effect?}:
#   - pay-bonus: value = extra pay %, stacks with leveling.pay-bonus-per-level.
#   - potion: value = effect amplifier (1 = level I), effect = a PotionEffectType name
#     (e.g. FAST_DIGGING, WATER_BREATHING, SPEED). Kept up only while the job is joined.
#   - double-drop: value = % chance a mined/chopped/harvested block's drop doubles.
#     Only meaningful for miner/digger/woodcutter/farmer.
#   - auto-smelt: value is unused - ore blocks drop already smelted per auto-smelt-map above.
#     Only meaningful for miner.
#   - xp-orb-bonus: value = flat extra *vanilla* xp (not job xp) per action.
# "level" is an effective level (level + prestige * leveling.max-level), so prestiging a job never
# takes a perk away. Leave a job's perks list empty (or omit it) to disable perks for that job.
# (日本語) どのジョブにも "perks:" (パーク) リストを追加できる。お金/経験値以外の、レベルで
# 解放される特典で、GUIの職業詳細画面(職業をシフト右クリック)に表示される。各項目は
# {level, type, value, effect?}:
#   - pay-bonus: valueがそのジョブの報酬への追加%(leveling.pay-bonus-per-levelと加算)。
#   - potion: valueが効果のレベル(1=効果I)、effectがPotionEffectType名
#     (例: FAST_DIGGING、WATER_BREATHING、SPEED)。就職中のみ維持される。
#   - double-drop: valueが採掘/伐採/収穫したブロックのドロップが倍になる確率(%)。
#     採掘工/穴掘り/木こり/農家でのみ意味を持つ。
#   - auto-smelt: valueは未使用。上のauto-smelt-mapに従い、鉱石が精錬済みでドロップする。
#     採掘工でのみ意味を持つ。
#   - xp-orb-bonus: valueが1回の行動で得られる*バニラの*経験値(ジョブの経験値とは別)。
# "level"は実効レベル(レベル + プレステージ回数 × leveling.max-level)なので、プレステージ
# してもパークが失われることはない。パークを使いたくないジョブは perks を空にする(または
# 書かない)だけでよい。
jobs:
  miner:
    actions:
      break-block:
        COAL_ORE: { money: 4, xp: 3 }
        DEEPSLATE_COAL_ORE: { money: 4, xp: 3 }
        COPPER_ORE: { money: 4, xp: 3 }
        DEEPSLATE_COPPER_ORE: { money: 4, xp: 3 }
        IRON_ORE: { money: 7, xp: 5 }
        DEEPSLATE_IRON_ORE: { money: 7, xp: 5 }
        GOLD_ORE: { money: 10, xp: 6 }
        DEEPSLATE_GOLD_ORE: { money: 10, xp: 6 }
        NETHER_GOLD_ORE: { money: 8, xp: 5 }
        REDSTONE_ORE: { money: 6, xp: 4 }
        DEEPSLATE_REDSTONE_ORE: { money: 6, xp: 4 }
        LAPIS_ORE: { money: 6, xp: 4 }
        DEEPSLATE_LAPIS_ORE: { money: 6, xp: 4 }
        DIAMOND_ORE: { money: 40, xp: 20 }
        DEEPSLATE_DIAMOND_ORE: { money: 40, xp: 20 }
        EMERALD_ORE: { money: 45, xp: 22 }
        DEEPSLATE_EMERALD_ORE: { money: 45, xp: 22 }
        NETHER_QUARTZ_ORE: { money: 5, xp: 3 }
        ANCIENT_DEBRIS: { money: 120, xp: 60 }
    perks:
      - { level: 15, type: potion, value: 1, effect: FAST_DIGGING }
      - { level: 30, type: double-drop, value: 15 }
      - { level: 50, type: pay-bonus, value: 10 }
      - { level: 100, type: auto-smelt }

  digger:
    actions:
      # xp raised 5x over money-equivalent digger/builder had the lowest xp of any job by far
      # (0.2-0.4/block) - combined with the old leveling curve, digging alone needed ~300,000
      # blocks to hit max level. Money is untouched (no economy inflation), only xp moved.
      # (日本語) 穴掘り/建築士は、お金に対して経験値だけが他のどのジョブより低かった
      # (1ブロックあたり0.2〜0.4)。旧レベル曲線と組み合わさると、穴掘りだけで最大レベルまで
      # 約30万ブロック必要だった。お金はそのまま(経済インフレ回避)、経験値だけを5倍にした。
      break-block:
        DIRT: { money: 0.2, xp: 1 }
        GRASS_BLOCK: { money: 0.2, xp: 1 }
        SAND: { money: 0.2, xp: 1 }
        RED_SAND: { money: 0.2, xp: 1 }
        GRAVEL: { money: 0.3, xp: 1.5 }
        CLAY: { money: 0.5, xp: 2 }
        STONE: { money: 0.3, xp: 1.5 }
        COBBLESTONE: { money: 0.3, xp: 1.5 }
        DEEPSLATE: { money: 0.3, xp: 1.5 }
        COBBLED_DEEPSLATE: { money: 0.3, xp: 1.5 }
        NETHERRACK: { money: 0.2, xp: 1 }
        SOUL_SAND: { money: 0.4, xp: 1.5 }
        SOUL_SOIL: { money: 0.4, xp: 1.5 }
        END_STONE: { money: 0.4, xp: 1.5 }

  woodcutter:
    actions:
      break-block:
        OAK_LOG: { money: 2, xp: 1.5 }
        SPRUCE_LOG: { money: 2, xp: 1.5 }
        BIRCH_LOG: { money: 2, xp: 1.5 }
        JUNGLE_LOG: { money: 2.5, xp: 1.8 }
        ACACIA_LOG: { money: 2.5, xp: 1.8 }
        DARK_OAK_LOG: { money: 2.5, xp: 1.8 }
        MANGROVE_LOG: { money: 2.5, xp: 1.8 }
        CHERRY_LOG: { money: 3, xp: 2 }
        CRIMSON_STEM: { money: 3, xp: 2 }
        WARPED_STEM: { money: 3, xp: 2 }
    perks:
      - { level: 40, type: double-drop, value: 15 }
      - { level: 80, type: pay-bonus, value: 10 }

  farmer:
    actions:
      # Crops must grow to their maximum age (which always takes real time) before they pay out,
      # so - unlike miner/digger/woodcutter - a farmer is never checked against the placed-block
      # tracker: replanting is the normal way to earn this money, not an exploit.
      harvest-crop:
        WHEAT: { money: 3, xp: 2 }
        CARROTS: { money: 3, xp: 2 }
        POTATOES: { money: 3, xp: 2 }
        BEETROOTS: { money: 3, xp: 2 }
        NETHER_WART: { money: 4, xp: 2.5 }
        COCOA: { money: 5, xp: 3 }
      harvest-tall-plant:
        MELON: { money: 4, xp: 2 }
        PUMPKIN: { money: 4, xp: 2 }
    perks:
      - { level: 40, type: double-drop, value: 15 }
      - { level: 80, type: pay-bonus, value: 10 }

  builder:
    actions:
      # xp raised 5x over money for the same reason as digger above (see its comment).
      place-block:
        default: { money: 0.15, xp: 0.5 }

  fisherman:
    actions:
      catch-fish:
        COD: { money: 5, xp: 3 }
        SALMON: { money: 6, xp: 3 }
        PUFFERFISH: { money: 8, xp: 4 }
        TROPICAL_FISH: { money: 9, xp: 5 }
      # EvenMoreFish が導入されている場合のみ使う。キーはEMF側のレア度名(小文字)で、
      # そちらで独自のレア度を追加しているならここに同じ名前で足せばよい。名前が一致しない
      # レア度は default が使われる。EMF未導入なら、この欄はまったく使われない。
      catch-emf-fish:
        common: { money: 10, xp: 5 }
        uncommon: { money: 25, xp: 12 }
        rare: { money: 60, xp: 30 }
        epic: { money: 120, xp: 60 }
        legendary: { money: 300, xp: 150 }
        mythic: { money: 600, xp: 300 }
        default: { money: 15, xp: 8 }
    perks:
      - { level: 20, type: potion, value: 1, effect: WATER_BREATHING }
      - { level: 60, type: pay-bonus, value: 10 }
      - { level: 100, type: xp-orb-bonus, value: 3 }

  treasurehunter:
    actions:
      # 釣りで魚以外が釣れた時。本物のお宝だけを個別に高額で載せ、載っていない物
      # (棒・革・ボウル・濡れた本などのジャンク)は default の少額になる。
      # 以前は全部が default の40円だったため、タラ5円に対してゴミが40円という逆転が起き、
      # 放置釣り機でゴミを釣り続けるのが最も儲かる状態になっていた。
      catch-treasure:
        NAME_TAG: { money: 80, xp: 35 }
        SADDLE: { money: 80, xp: 35 }
        NAUTILUS_SHELL: { money: 70, xp: 30 }
        ENCHANTED_BOOK: { money: 60, xp: 30 }
        BOW: { money: 40, xp: 20 }
        FISHING_ROD: { money: 40, xp: 20 }
        default: { money: 2, xp: 1 }

  hunter:
    actions:
      kill-mob:
        ZOMBIE: { money: 4, xp: 3 }
        HUSK: { money: 4, xp: 3 }
        DROWNED: { money: 5, xp: 3 }
        SKELETON: { money: 4, xp: 3 }
        STRAY: { money: 5, xp: 3 }
        SPIDER: { money: 4, xp: 3 }
        CAVE_SPIDER: { money: 5, xp: 3 }
        CREEPER: { money: 6, xp: 4 }
        ENDERMAN: { money: 8, xp: 5 }
        WITCH: { money: 10, xp: 6 }
        PILLAGER: { money: 7, xp: 4 }
        VINDICATOR: { money: 10, xp: 6 }
        RAVAGER: { money: 30, xp: 15 }
        PHANTOM: { money: 8, xp: 5 }
        SLIME: { money: 3, xp: 2 }
        MAGMA_CUBE: { money: 3, xp: 2 }
        BLAZE: { money: 12, xp: 7 }
        GHAST: { money: 15, xp: 8 }
        SHULKER: { money: 20, xp: 10 }
        GUARDIAN: { money: 12, xp: 7 }

  archer:
    actions:
      # Any hostile-mob kill (from hunter's list above) where the fatal blow was a projectile,
      # instead of melee, pays this flat rate on top of - not instead of - the hunter payout.
      kill-mob-ranged:
        default: { money: 6, xp: 4 }

  slayer:
    actions:
      kill-boss:
        ENDER_DRAGON: { money: 5000, xp: 2000 }
        WITHER: { money: 2500, xp: 1000 }
        ELDER_GUARDIAN: { money: 300, xp: 150 }
        WARDEN: { money: 4000, xp: 1800 }

  warrior:
    actions:
      kill-player:
        default: { money: 50, xp: 25 }

  breeder:
    actions:
      breed-entity:
        COW: { money: 8, xp: 5 }
        MUSHROOM_COW: { money: 8, xp: 5 }
        SHEEP: { money: 8, xp: 5 }
        PIG: { money: 8, xp: 5 }
        CHICKEN: { money: 6, xp: 4 }
        RABBIT: { money: 8, xp: 5 }
        HORSE: { money: 15, xp: 8 }
        DONKEY: { money: 12, xp: 7 }
        MULE: { money: 12, xp: 7 }
        LLAMA: { money: 10, xp: 6 }
        WOLF: { money: 10, xp: 6 }
        CAT: { money: 10, xp: 6 }
        TURTLE: { money: 10, xp: 6 }
        BEE: { money: 10, xp: 6 }
        AXOLOTL: { money: 10, xp: 6 }
        default: { money: 8, xp: 5 }

  tamer:
    actions:
      tame-entity:
        WOLF: { money: 12, xp: 8 }
        CAT: { money: 12, xp: 8 }
        HORSE: { money: 15, xp: 9 }
        DONKEY: { money: 12, xp: 7 }
        PARROT: { money: 10, xp: 6 }
        LLAMA: { money: 12, xp: 7 }
        default: { money: 10, xp: 6 }

  shearer:
    actions:
      shear-entity:
        SHEEP: { money: 3, xp: 2 }
        MUSHROOM_COW: { money: 5, xp: 3 }
        SNOWMAN: { money: 2, xp: 1 }
        default: { money: 3, xp: 2 }

  beekeeper:
    actions:
      harvest-block:
        BEEHIVE: { money: 8, xp: 5 }
        BEE_NEST: { money: 8, xp: 5 }

  enchanter:
    actions:
      # Scaled by the enchant's XP-level cost (a natural difficulty proxy), not a flat rate.
      enchant-item:
        default: { money-per-level: 4, xp-per-level: 3 }

  smelter:
    actions:
      smelt-item:
        IRON_INGOT: { money: 3, xp: 2 }
        GOLD_INGOT: { money: 4, xp: 2.5 }
