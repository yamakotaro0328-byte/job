    # Same color-family scheme as job-names.en above - keep both in sync.
    miner: "&7採掘工&r"
    digger: "&8穴掘り師&r"
    woodcutter: "&2木こり&r"
    farmer: "&a農家&r"
    builder: "&6建築士&r"
    fisherman: "&b漁師&r"
    treasurehunter: "&eお宝ハンター&r"
    hunter: "&4ハンター&r"
    archer: "&3弓術師&r"
    slayer: "&4討伐者&r"
    warrior: "&9戦士&r"
    breeder: "&d繁殖家&r"
